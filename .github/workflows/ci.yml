name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo build
        run: cargo build --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo fmt
        run: cargo fmt --check --workspace

      - name: Cargo test
        run: cargo test --workspace
        env:
          SOROBAN_TEST_SNAPSHOT_UPDATE: "0"
          # Fail CI if insta snapshots are missing or changed.
          INSTA_UPDATE: "no"

      - name: Validate insta snapshots
        run: |
          cargo install cargo-insta --locked 2>/dev/null || true
          cargo insta test --workspace --unreferenced=reject
        env:
          INSTA_UPDATE: "no"

  bench:
    name: Benchmarks (smoke-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks (1 sample — smoke test only)
        run: cargo bench -p cli -- --sample-size 10

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: target/criterion/

  deny:
    name: License & advisory check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Run cargo-machete
        run: cargo machete
