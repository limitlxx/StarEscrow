[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "star-escrow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Issue #141: hierarchical config (file → env → CLI args)
config = { version = "0.14", features = ["toml"] }
# Issue #140: interactive prompts
dialoguer = "0.11"
# Issue #139: progress bars for batch operations
indicatif = "0.17"
# TTY detection for prompt/progress guards
console = "0.15"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
stellar-strkey = "0.0.9"
ed25519-dalek = "2"
base64 = "0.22"
# Issue #142: secure secret key storage via OS keychain
keyring = "2"
# Issue #143: direct Soroban RPC calls
reqwest = { version = "0.11", features = ["json", "blocking"] }
# Issue #144: XDR encoding/decoding
stellar-xdr = { version = "21", features = ["curr"] }
# Issue #149: tabular CLI output
tabled = "0.14"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
insta = { version = "1", features = ["json"] }
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "macros"] }

[[bench]]
name = "cli_benches"
harness = false
